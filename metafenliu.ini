custom_proxy_group=🧊 冷门节点`select`^(?!.*(🇭🇰|香港|Hong.?Kong|HKG|(^|[^A-Za-z])[Hh][Kk]([^A-Za-z]|$)|🇹🇼|台湾|台灣|Taiwan|Taipei|Hinet|(^|[^A-Za-z])[Tt][Ww]([^A-Za-z]|$)|🇯🇵|日本|Japan|Tokyo|Osaka|(^|[^A-Za-z])[Jj][Pp]([^A-Za-z]|$)|🇸🇬|新加坡|Singapore|(^|[^A-Za-z])[Ss][Gg]([^A-Za-z]|$)|🇺🇸|美国|美國|United.?States|USA|Los.?Angeles|San.?Jose|Seattle|New.?York|(^|[^A-Za-z])[Uu][Ss]([^A-Za-z]|$))).+


; ==========================================================
; 6) 最终说明
; ==========================================================
; 主路由/旁路由的 CHINA_IP_ROUTE / DNS / 客户端网关与 DNS
; 必须在 OpenClash 面板和客户端网络设置中单独配置，不能由本 INI 完成。
; 主路由模式：客户端默认网关通常指向主路由，客户端 DNS 指向主路由 LAN 地址。
; 旁路由模式：全局透明代理时客户端默认网关通常指向旁路由；仅 DNS 分流时网关可仍指向主路由。
; DHCP 由谁提供不决定 INI 是否兼容，也不等于默认网关一定指向 DHCP 服务器。
