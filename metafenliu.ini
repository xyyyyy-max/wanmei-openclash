[custom]
; ==========================================================
; 方案 A · 五层分流架构版（主路由/旁路由通用版，2026-11-05）
; 适用：Sub-Converter 外部配置 + OpenClash（主路由 / 旁路由通用）
;
; 架构：
; 1. 系统层：OpenClash 绕过中国大陆 IP（主路由/旁路由均需在面板另行设置）
; 2. 内核层：应用规则优先，国内规则再次兜底
; 3. 策略层：应用 -> HK/TW/JP/SG/US/冷门节点
; 4. 兜底层：自定义代理补充 -> GFW -> 非标端口 -> FINAL
; 5. DNS：OpenClash 统一接管（需在面板及客户端网络中另行设置）
;
; 注意：
; - 本文件是 Sub-Converter INI，不是 OpenClash 主 YAML；主路由/旁路由共用同一份。
; - 冷门节点使用负向前瞻正则，需确认实际转换器支持 ECMAScript lookahead。
; - 应用组不直接引用“全部节点/自动选择/Default”，避免间接越权。
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 0) 节点备注过滤
; ==========================================================
exclude_remarks=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

; ==========================================================
; 1) 规则（自上而下匹配，具体应用优先）
; ==========================================================

; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁：作为明确直连例外，优先于应用分流 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Adobe：使用明确域名规则，不依赖未确认的 GEOSITE,adobe ---
ruleset=🟥 Adobe,[]DOMAIN-SUFFIX,adobe.com
ruleset=🟥 Adobe,[]DOMAIN-SUFFIX,adobe.io
ruleset=🟥 Adobe,[]DOMAIN-SUFFIX,adobe.net
ruleset=🟥 Adobe,[]DOMAIN-SUFFIX,adobecc.com
ruleset=🟥 Adobe,[]DOMAIN-SUFFIX,adobeconnect.com
ruleset=🟥 Adobe,[]DOMAIN-SUFFIX,typekit.net

