[custom]
; ==========================================================
; 方案 A · 修正版（2026-11-05）
; - 保留 HK / TW / JP / SG / US 五个 url-test 地区组
; - 应用组不提供“全节点手动 / 全节点自动”越权
; - 全节点手动 / 自动只放在 Default / 漏网之鱼
; - 冷门节点排除五大地区关键词（按节点名称匹配）
; - Adobe 提供 REJECT
; - Google Voice 使用独立域名规则，不再引用不存在的 GEOSITE,google-voice
; - Supercell 增加 DIRECT 选项
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================

; --- Adobe：置顶，允许在策略组中选择 REJECT ---
ruleset=🟥 Adobe,[]GEOSITE,adobe

; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁：优先于应用规则 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Google Voice 专属规则 ---
; Google Voice 专属域名先命中独立策略组
; Google 的通用 API / 静态资源域名仍由下方 Google 规则处理，避免把所有 Google 服务误分到 Voice
ruleset=☎️ Google Voice,[]DOMAIN-SUFFIX,voice.google.com
ruleset=☎️ Google Voice,[]DOMAIN-SUFFIX,telephony.goog
ruleset=☎️ Google Voice,[]DOMAIN,lens.l.google.com
ruleset=☎️ Google Voice,[]DOMAIN,stun.l.google.com

; --- 核心应用：具体应用放在通用分类之前 ---
ruleset=🎮 Supercell,[]GEOSITE,supercell
ruleset=🎮 Steam,[]GEOSITE,steam

ruleset=📦 Notion,[]GEOSITE,notion
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix

; --- 海外主流应用补充 ---
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; --- 开发 / 工具 ---
ruleset=🛠 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest

; --- 交易所 ---
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit

; --- 通用应用分类：放在具体应用之后，避免提前截胡 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- 国内直连 ---
; google-cn 放在 cn 前面，避免被 cn 规则提前匹配而失去独立作用
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 游戏 / BT 通用兜底：具体 Supercell、Steam 已在前面处理 ---
ruleset=DIRECT,[]GEOSITE,category-games
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- Aethersailor 代理补丁：放在具体应用规则之后，仅作补漏 ---
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- GFW 兜底 ---
ruleset=🚀 手动选择,[]GEOSITE,gfw

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 2) 应用分流策略组（UI 主入口，不提供全节点越权）
; ==========================================================

; Supercell 新增 DIRECT
custom_proxy_group=🎮 Supercell`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]🌐 Default

custom_proxy_group=📦 Notion`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]🌐 Default
custom_proxy_group=🍎 Apple`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]🌐 Default
custom_proxy_group=🤖 ChatGPT`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=🧠 AI`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=📨 Telegram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=📞 即时通讯`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=💬 社交媒体`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default

custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=🎥 Netflix`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default

custom_proxy_group=🎵 TikTok`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=📸 Instagram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=🐦 X`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default

custom_proxy_group=🛠 GitHub`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]🧭 全部节点`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default

custom_proxy_group=🟦 OKX`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]🌐 Default
custom_proxy_group=🟨 Binance`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]🌐 Default
custom_proxy_group=🟪 Bybit`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]🌐 Default

; Adobe：允许一键禁止联网
custom_proxy_group=🟥 Adobe`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`[]REJECT`[]🌐 Default
custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=☎️ Google Voice`select`[]🇺🇸 US`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🧊 冷门节点`[]🌐 Default
custom_proxy_group=☁️ cloudflare`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default
; Microsoft：允许直连优先
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🌐 Default


; ==========================================================
; 3) Default / 漏网之鱼（允许全节点）
; ==========================================================

custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]🧭 全部节点`[]DIRECT
custom_proxy_group=🌐 Default`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]♻️ 自动选择`[]🧭 全部节点`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点`[]🚀 手动选择


; ==========================================================
; 4) 非标端口
; ==========================================================

custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 5) 节点测速与地区分组
; ==========================================================

; 全节点（允许任何节点显示）
custom_proxy_group=🧭 全部节点`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,300

; 地区组：使用较简洁的关键词表达式，避免原文件中过度转义的反斜杠
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|Hong.?Kong|HKG|(^|[^A-Za-z])HK([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,,300
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|台灣|Taiwan|Taipei|Hinet|(^|[^A-Za-z])TW([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,,300
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|Japan|Tokyo|Osaka|(^|[^A-Za-z])JP([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,,300
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|Singapore|(^|[^A-Za-z])SG([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,,300
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|美國|United.?States|USA|Los.?Angeles|San.?Jose|Seattle|New.?York|(^|[^A-Za-z])US([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,,300

; 冷门节点池：采用常见非五大区国家/地区的正向匹配，避免使用 Go 正则不支持的负向前瞻
; 按节点名称筛选；未包含在关键词列表中的冷门地区节点不会自动进入此组
custom_proxy_group=🧊 冷门节点`select`(?i)(🇨🇦|加拿大|Canada|🇬🇧|英国|UK|United.?Kingdom|London|🇩🇪|德国|Germany|Frankfurt|🇫🇷|法国|France|Paris|🇳🇱|荷兰|Netherlands|Amsterdam|🇦🇺|澳大利亚|Australia|Sydney|Melbourne|🇰🇷|韩国|Korea|Seoul|🇮🇳|印度|India|🇹🇷|土耳其|Turkey|🇷🇺|俄罗斯|Russia|🇹🇭|泰国|Thailand|🇲🇾|马来西亚|Malaysia|🇵🇭|菲律宾|Philippines|🇮🇩|印尼|Indonesia|🇻🇳|越南|Vietnam|🇧🇷|巴西|Brazil|🇲🇽|墨西哥|Mexico|🇦🇪|阿联酋|UAE|Dubai|🇨🇭|瑞士|Switzerland|🇸🇪|瑞典|Sweden|🇳🇴|挪威|Norway|🇫🇮|芬兰|Finland|🇮🇹|意大利|Italy|🇪🇸|西班牙|Spain|🇵🇱|波兰|Poland|🇨🇿|捷克|Czech|🇿🇦|南非|South.?Africa|🇮🇱|以色列|Israel)
