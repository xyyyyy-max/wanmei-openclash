custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点`[]🚀 手动选择


; ==================== 4. 非标端口 ====================

custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==================== 5. 节点测速与地区分组 ====================

custom_proxy_group=🧭 全部节点`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300

custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|Hong.?Kong|HKG|(^|[^A-Za-z])HK([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|台湾|台灣|Taiwan|Taipei|Hinet|(^|[^A-Za-z])TW([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|Japan|Tokyo|Osaka|(^|[^A-Za-z])JP([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|Singapore|(^|[^A-Za-z])SG([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|美國|United.?States|USA|Los.?Angeles|San.?Jose|Seattle|New.?York|(^|[^A-Za-z])US([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300

